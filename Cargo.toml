[workspace]
members = ["crates/ide-core", "crates/lsp", "crates/dap", "crates/terminal", "crates/desktop"]
default-members = ["crates/desktop"]
exclude = ["vendor"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
ide-core = { path = "crates/ide-core" }
lsp = { path = "crates/lsp" }
dap = { path = "crates/dap" }
lsp-types = { version = "=0.97.0", features = ["proposed"] }
terminal = { path = "crates/terminal" }
anyhow = "1"
regex = "1.11"
alacritty_terminal = { version = "=0.26.0", default-features = false }
async-channel = "2"
futures-lite = "2"
notify = "7.0"
embed-resource = "3"
gpui = "=0.2.2"
gpui-component = { version = "=0.5.0", default-features = false }
gpui-component-assets = "=0.5.0"
ropey = { version = "=2.0.0-beta.1", features = ["metric_lines_lf", "metric_utf16"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-zig = "1.1"
tree-sitter-bash = "0.23.3"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.23.2"
tree-sitter-html = "0.23.2"
tree-sitter-json = "0.24.8"
tree-sitter-make = "1.1.1"
tree-sitter-md = "0.5.1"
tree-sitter-python = "0.23.6"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-yaml = "0.7.1"

[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
